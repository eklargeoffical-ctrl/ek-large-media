<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Large Sahab Productions film engine</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;overflow:hidden}
.layer{position:absolute;inset:0}
#rays{position:absolute;left:50%;top:50%;width:3600px;height:3600px;margin:-1800px 0 0 -1800px}
#dots{background-image:radial-gradient(rgba(0,0,0,.2) 2.2px,transparent 2.6px);background-size:14px 14px;mix-blend-mode:multiply}
#vig{background:radial-gradient(circle at 50% 45%,transparent 38%,rgba(20,0,0,.7) 100%)}
#grain{width:1080px;height:1920px;opacity:.16;mix-blend-mode:overlay}
#flash{background:radial-gradient(circle at 50% 50%,#FFF3C4,#FFB347 45%,rgba(255,120,0,0) 75%);opacity:0;mix-blend-mode:screen}
.scene{position:absolute;inset:0;display:none}
.hi{font-family:'FreeSerif',serif;font-weight:700}
.big-hi{white-space:nowrap;color:#FFC93C;-webkit-text-stroke:9px #15100C;paint-order:stroke fill;text-shadow:12px 12px 0 #15100C}
.en{white-space:nowrap;font-family:'Inter';font-weight:900;font-style:italic;color:#FCE9C2;text-shadow:6px 6px 0 #15100C;letter-spacing:6px}
.cap{font-family:'Inter';font-weight:800;color:#FCE9C2;letter-spacing:10px}
.sub{position:absolute;left:60px;right:60px;text-align:center;font-family:'Inter';font-weight:900;font-size:64px;line-height:1.15;color:#FFD23F;-webkit-text-stroke:10px #000;paint-order:stroke fill}
.halo{position:absolute;left:50%;border-radius:50%;background:#FCE9C2;box-shadow:0 0 0 16px #15100C,0 0 0 34px #FFC93C}
.clock{white-space:nowrap;font-family:'Inter';font-weight:900;font-style:italic;color:#FCE9C2;-webkit-text-stroke:8px #15100C;paint-order:stroke fill;text-shadow:10px 10px 0 #15100C;letter-spacing:-2px;line-height:1}
.bubble{position:absolute;left:90px;right:90px;background:#FFFDF5;border:9px solid #15100C;border-radius:56px;box-shadow:14px 14px 0 #15100C;padding:46px 40px;text-align:center;font-family:'Inter';font-weight:900;font-size:84px;line-height:1.08;color:#15100C}
.bubble:after{content:'';position:absolute;left:150px;bottom:-62px;border-width:62px 46px 0 0;border-style:solid;border-color:#15100C transparent transparent transparent}
#sline:after{left:auto;right:50%;bottom:auto;top:-62px;border-width:0 46px 62px 0;border-color:transparent #15100C transparent transparent}
.pill{display:inline-block;background:#15100C;color:#FFC93C;font-family:'Inter';font-weight:800;font-size:30px;letter-spacing:8px;padding:14px 28px;border-radius:999px}
.credits{position:absolute;left:70px;right:70px;text-align:center;font-family:'Inter';font-weight:700;font-size:24px;letter-spacing:3px;line-height:1.55;color:#FCE9C2}
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="bg"><div id="rays"></div></div>
  <div class="layer" id="dots"></div>
  <div id="scenes" class="layer"></div>
  <div class="layer" id="vig"></div>
  <canvas id="grain" class="layer" width="270" height="480"></canvas>
  <div class="layer" id="flash"></div>
  <svg class="layer" id="scratch" width="1080" height="1920"></svg>
</div>
<script src="../sahab.js"></script>
<script>
// ---------- Large Sahab rig: brows, blink, glint, talking mouth, moustache twitch ----------
const SKIN = `<ellipse cx="150" cy="262" rx="17" ry="25" fill="#C2835A"/><ellipse cx="330" cy="262" rx="17" ry="25" fill="#C2835A"/><ellipse cx="240" cy="252" rx="92" ry="110" fill="#CF9468"/><path d="M150 236 Q144 146 240 136 Q336 146 330 236 Q322 186 286 172 Q240 160 194 172 Q158 186 150 236 Z" fill="#ECE7DD"/><path d="M148 250 Q140 206 160 186 Q156 222 164 252 Z" fill="#ECE7DD"/><path d="M332 250 Q340 206 320 186 Q324 222 316 252 Z" fill="#ECE7DD"/><path d="M240 256 Q236 282 226 292 Q240 300 256 292" stroke="#A4663F" stroke-width="4" stroke-linecap="round" fill="none"/>`;
function rig(p, size) {
  // p: raise (0..1), frown (0..1), blink (0..1), mouth (0..1), glint (0..1 sweep), twitch (-1..1), look (-1..1)
  const r = (p.raise || 0) * 16, f = (p.frown || 0) * 14, lk = (p.look || 0) * 5;
  const brows = `<path d="M178 ${210 - r} Q200 ${198 - r - f * .2} 224 ${206 - r + f}" stroke="#F6F3EC" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M256 ${206 - r + f} Q280 ${198 - r - f * .2} 302 ${210 - r}" stroke="#F6F3EC" stroke-width="11" stroke-linecap="round" fill="none"/>`;
  const open = Math.max(0, 1 - (p.blink || 0) * 2);
  const eyes = open > .15
    ? `<ellipse cx="${201 + lk}" cy="243" rx="7.5" ry="${7.5 * open}" fill="#1E1410"/><ellipse cx="${279 + lk}" cy="243" rx="7.5" ry="${7.5 * open}" fill="#1E1410"/><circle cx="${204 + lk}" cy="240" r="2.4" fill="#fff"/><circle cx="${282 + lk}" cy="240" r="2.4" fill="#fff"/>`
    : `<path d="M193 244 Q201 248 209 244" stroke="#1E1410" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M271 244 Q279 248 287 244" stroke="#1E1410" stroke-width="4" stroke-linecap="round" fill="none"/>`;
  const g = p.glint || 0;
  const glint = g > 0 && g < 1 ? `<clipPath id="gl"><circle cx="201" cy="243" r="23"/><circle cx="279" cy="243" r="23"/></clipPath><g clip-path="url(#gl)"><rect x="${150 + g * 170}" y="200" width="14" height="90" fill="#fff" opacity=".85" transform="rotate(25 ${157 + g * 170} 245)"/></g>` : '';
  const glasses = `<circle cx="201" cy="243" r="25" fill="#FFFFFF" fill-opacity="0.16" stroke="#1E1410" stroke-width="4.5"/><circle cx="279" cy="243" r="25" fill="#FFFFFF" fill-opacity="0.16" stroke="#1E1410" stroke-width="4.5"/><path d="M226 245 Q240 235 254 245" stroke="#1E1410" stroke-width="4" fill="none"/>`;
  const m = p.mouth || 0;
  const mouth = `<ellipse cx="240" cy="${334 + m * 6}" rx="${12 + m * 9}" ry="${4 + m * 16}" fill="#5A2320"/>` + (m > .35 ? `<ellipse cx="240" cy="${342 + m * 8}" rx="${6 + m * 4}" ry="${3 + m * 4}" fill="#B5544A"/>` : '');
  const tw = (p.twitch || 0) * 4, lift = m * 5;
  const mous = `<g transform="translate(0 ${-lift}) rotate(${tw} 240 312)"><path d="M240 300 C262 288 294 290 314 304 C328 314 342 310 348 294 C358 314 348 336 324 336 C300 336 278 322 240 322 Z" fill="#F6F3EC"/><path d="M240 300 C218 288 186 290 166 304 C152 314 138 310 132 294 C122 314 132 336 156 336 C180 336 202 322 240 322 Z" fill="#F6F3EC"/></g>`;
  const blush = `<circle cx="186" cy="290" r="15" fill="#D9705A" fill-opacity="0.3"/><circle cx="294" cy="290" r="15" fill="#D9705A" fill-opacity="0.3"/>`;
  return `<svg viewBox="116 124 248 248" width="${size}" height="${size}">${SKIN}${blush}${brows}${eyes}${glasses}${glint}${mouth}${mous}</svg>`;
}

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
let SPEC = null, BUILT = {}, seed = 1;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const MOODS = {
  red:   ['#E0471E', '#B3201F'],
  amber: ['#F08A24', '#C2561A'],
  plum:  ['#8E2C6B', '#5B1846'],
  night: ['#1F2A5C', '#101634'],
  gold:  ['#F2B33D', '#D9831F'],
};
function setMood(k) { const [a, b] = MOODS[k] || MOODS.red; document.getElementById('rays').style.background = `repeating-conic-gradient(from 0deg,${a} 0 6deg,${b} 6deg 12deg)`; document.getElementById('bg').style.background = b; }

// ---------- scene builders ----------
function poster(id, s, end) {
  const d = document.createElement('div'); d.className = 'scene'; d.id = id;
  d.innerHTML = `
    ${!end && s.hook ? `<div id="${id}-hook" style="position:absolute;top:150px;left:50px;right:50px;text-align:center"><span style="display:inline-block;background:#15100C;color:#FFD23F;font-family:'Inter';font-weight:900;font-size:54px;line-height:1.15;padding:16px 30px;border-radius:18px;transform:rotate(-1.5deg);box-shadow:8px 8px 0 #FFC93C">${s.hook}</span></div>` : ''}
    ${!end && s.hook ? '' : `<div class="cap" style="position:absolute;top:262px;left:0;right:0;text-align:center;font-size:28px;letter-spacing:12px">LARGE SAHAB PRODUCTIONS ${end ? '' : 'PRESENTS'}</div>`}
    <div class="halo" style="top:350px;width:660px;height:660px;margin-left:-330px"></div>
    <div id="${id}-face" style="position:absolute;left:50%;top:370px;margin-left:-310px;width:620px;height:620px"></div>
    <div id="${id}-t1" class="hi big-hi" style="position:absolute;top:1000px;left:0;right:0;text-align:center;font-size:250px;line-height:1">${s.title_hi}</div>
    <div id="${id}-t2" class="en" style="position:absolute;top:1282px;left:0;right:0;text-align:center;font-size:86px">${s.title_en}</div>
    ${end
      ? `<div id="${id}-l1" style="position:absolute;top:1400px;left:60px;right:60px;text-align:center;font-family:'Lora';font-style:italic;font-size:50px;color:#FCE9C2">${s.end.line1}</div>
         <div id="${id}-l2" style="position:absolute;top:1478px;left:60px;right:60px;text-align:center"><span class="pill">${s.end.line2}</span></div>
         <div class="credits" style="top:1572px">LARGE SAHAB PRODUCTIONS · @EK.LARGE · 18+</div>`
      : `<div style="position:absolute;top:1400px;left:60px;right:60px;text-align:center;font-family:'Lora';font-style:italic;font-size:48px;color:#FCE9C2">${s.tagline}</div>`}
  `;
  return d;
}
function nightScene(s) {
  const d = document.createElement('div'); d.className = 'scene'; d.id = 'night';
  d.innerHTML = `
    <div style="position:absolute;top:300px;right:150px;width:260px;height:260px;border-radius:50%;background:#FFF1C9;box-shadow:0 0 120px 40px rgba(255,236,170,.35)"></div>
    <svg style="position:absolute;left:0;bottom:240px" width="1080" height="560" viewBox="0 0 1080 560"><path d="M0 560 V330 h90 v-90 h70 v130 h60 v-210 h110 v170 h50 v-120 h90 v200 h70 v-260 h120 v240 h60 v-140 h100 v180 h80 v-90 h80 V560 Z" fill="#0A0D1F"/>${[...Array(26)].map((_, i) => `<rect x="${60 + (i * 137) % 980}" y="${300 + (i * 89) % 220}" width="16" height="22" fill="#FFC93C" opacity="${.5 + (i % 3) * .2}"/>`).join('')}</svg>
    ${s.night.lines.map((l, i) => `<div id="nl${i}" class="hi big-hi" style="position:absolute;left:0;right:0;top:${720 + i * 190}px;text-align:center;font-family:'Inter';font-weight:900;font-style:italic;font-size:140px;-webkit-text-stroke:8px #15100C">${l}</div>`).join('')}
  `;
  return d;
}
function beatScene(b, i) {
  const d = document.createElement('div'); d.className = 'scene'; d.id = 'beat' + i;
  const n = b.glasses, cols = n === 1 ? 1 : n <= 4 ? 4 : 4;
  const sticker = b.sticker ? `<div class="stk" style="position:absolute;left:${n ? 70 : 0}px;${n ? '' : 'right:0;'}top:${n ? 1330 : 1080}px;text-align:center;font-size:${n ? 170 : 300}px;line-height:1;font-family:'Noto Color Emoji'">${b.sticker}</div>` : '';
  const icons = [...Array(n)].map((_, k) => `<div class="gl" style="display:inline-block;margin:10px ${n > 4 ? 4 : 14}px">${SAHAB.icon(['neat', 'rocks', 'splash', 'rocks'][k % 4], n === 1 ? 320 : n <= 4 ? 200 : 118, '#FCE9C2')}</div>`).join('');
  d.innerHTML = `
    <div style="position:absolute;top:250px;left:0;right:0;text-align:center"><span class="pill" style="background:#FFC93C;color:#15100C">${b.label}</span></div>
    <div class="clock" style="position:absolute;top:340px;left:0;right:0;text-align:center;font-size:230px"><span>${b.time}</span></div>
    <div class="bubble" style="top:660px">${b.line}</div>
    <div id="gl${i}" style="position:absolute;left:40px;right:40px;top:${n === 1 ? 1080 : 1050}px;text-align:center">${icons}</div>
    ${sticker}
    <div style="position:absolute;right:56px;bottom:250px;width:300px;height:300px;border-radius:50%;background:#FCE9C2;box-shadow:0 0 0 10px #15100C,0 0 0 20px #FFC93C;overflow:hidden"><div id="cam${i}" style="margin:10px"></div></div>
  `;
  return d;
}
function sahabScene(s) {
  const d = document.createElement('div'); d.className = 'scene'; d.id = 'sahab';
  d.innerHTML = `
    <div style="position:absolute;top:250px;left:0;right:0;text-align:center"><span class="pill">LARGE SAHAB</span></div>
    <div class="halo" style="top:390px;width:900px;height:900px;margin-left:-450px"></div>
    <div id="sface" style="position:absolute;left:50%;top:400px;margin-left:-440px;width:880px;height:880px"></div>
    <div id="sline" class="bubble" style="top:1350px;font-size:74px">${s.sahab.line}</div>
  `;
  return d;
}

function fitW(el, maxW, start, min) { let f = start; el.style.fontSize = f + 'px'; el.style.display = 'inline-block'; while (el.offsetWidth > maxW && f > min) { f -= 6; el.style.fontSize = f + 'px'; } el.style.display = ''; el.style.left = '0'; el.style.right = '0'; }
window.load = function (spec) {
  SPEC = spec;
  const root = document.getElementById('scenes'); root.innerHTML = '';
  root.appendChild(poster('open', spec, false));
  root.appendChild(nightScene(spec));
  spec.beats.forEach((b, i) => root.appendChild(beatScene(b, i)));
  root.appendChild(sahabScene(spec));
  root.appendChild(poster('end', spec, true));
  ['open', 'end'].forEach(id => { const sc = document.getElementById(id); sc.style.display = 'block';
    [[id + '-t1', 250, 120], [id + '-t2', 86, 50]].forEach(([eid, a, m]) => { const e = document.getElementById(eid); const sp = document.createElement('span'); sp.innerHTML = e.innerHTML; e.innerHTML = ''; e.appendChild(sp); let f = a; e.style.fontSize = f + 'px'; while (sp.offsetWidth > (id === 'open' ? 860 : 960) && f > m) { f -= 6; e.style.fontSize = f + 'px'; } });
    sc.style.display = 'none'; });
  const nt = document.getElementById('night'); nt.style.display = 'block';
  spec.night.lines.forEach((l, i) => { const e = document.getElementById('nl' + i); const sp = document.createElement('span'); sp.innerHTML = e.innerHTML; e.innerHTML = ''; e.appendChild(sp); e.style.whiteSpace = 'nowrap'; let f = 140; e.style.fontSize = f + 'px'; while (sp.offsetWidth > 900 && f > 60) { f -= 4; e.style.fontSize = f + 'px'; } });
  nt.style.display = 'none';
  return true;
};

function show(id) { document.querySelectorAll('.scene').forEach(e => e.style.display = e.id === id ? 'block' : 'none'); return document.getElementById(id); }
function whip(el, u) { // incoming whip pan over the first .2 s
  const k = ease(u / .2);
  el.style.transform = `translateX(${(1 - k) * 700}px)`;
  el.style.filter = u < .2 ? `blur(${(1 - k) * 18}px)` : 'none';
}
function flashAt(t, times) { let o = 0; times.forEach(x => { const d = t - x; if (d >= 0 && d < .3) o = Math.max(o, 1 - d / .3); }); document.getElementById('flash').style.opacity = o * .85; }
function shakeAt(t, times) { let a = 0; times.forEach(x => { const d = t - x; if (d >= 0 && d < .35) a = Math.max(a, (1 - d / .35) * 18); }); return a; }

window.render = function (t, frame) {
  const S = SPEC, T = S.times;
  seed = 1000 + (frame || 0) * 7;
  document.getElementById('rays').style.transform = `rotate(${t * 7}deg)`;
  // grain
  const c = document.getElementById('grain'), x = c.getContext('2d'), im = x.createImageData(270, 480);
  for (let i = 0; i < im.data.length; i += 4) { const v = rnd() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  x.putImageData(im, 0, 0);
  // scratches
  const sc = document.getElementById('scratch'); let lines = '';
  for (let i = 0; i < 2; i++) if (rnd() < .5) { const sx = rnd() * 1080; lines += `<line x1="${sx}" y1="0" x2="${sx + rnd() * 8 - 4}" y2="1920" stroke="rgba(255,240,210,.35)" stroke-width="${1 + rnd() * 2}"/>`; }
  sc.innerHTML = lines;
  const cuts = [T.night[0], ...T.beats.map(b => b[0]), T.sahab[0], T.end[0]];
  flashAt(t, cuts);
  const stage = document.getElementById('scenes');
  let sh = shakeAt(t, [0.05, T.end[0] + .05]);
  stage.style.transform = sh ? `translate(${(rnd() - .5) * sh}px,${(rnd() - .5) * sh}px)` : 'none';

  if (t < T.night[0]) {                       // ---- opening poster: title slams
    setMood('red'); const el = show('open'); el.style.transform = ''; el.style.filter = '';
    document.getElementById('open-face').innerHTML = rig({ raise: 1, mouth: .55, blink: (t > .9 && t < 1.0) ? 1 : 0 }, 620);
    const k = back(t / .22);
    document.getElementById('open-t1').style.transform = `scale(${1.15 - .15 * k})`;
    document.getElementById('open-t2').style.opacity = clamp((t - .3) / .15);
    const hk = document.getElementById('open-hook'); if (hk) hk.style.transform = `scale(${1.08 - .08 * ease(t / .3)})`;
    document.getElementById('open-t2').style.transform = `translateY(${(1 - ease((t - .3) / .2)) * 40}px)`;
  } else if (t < T.beats[0][0]) {             // ---- night: narrator
    setMood('night'); const el = show('night'); const u = t - T.night[0]; whip(el, u);
    S.night.lines.forEach((l, i) => { const at = S.night.at[i] - T.night[0]; const e = document.getElementById('nl' + i); const k = back((u - at) / .25); e.style.opacity = u >= at ? 1 : 0; e.style.transform = `scale(${u >= at ? 1.6 - .6 * k : 1})`; });
  } else if (t < T.sahab[0]) {                // ---- three beats
    const i = T.beats.findIndex(b => t >= b[0] && t < b[1]); const b = S.beats[i]; const u = t - T.beats[i][0];
    setMood(b.mood); const el = show('beat' + i); whip(el, u);
    if (b.wobble) el.style.transform += ` rotate(${Math.sin(u * 5) * 2.5}deg)`;
    const icons = document.querySelectorAll(`#gl${i} .gl`); const n = icons.length;
    icons.forEach((g, k) => { const at = b.pop[k] - T.beats[i][0]; const s = u >= at ? back((u - at) / .18) : 0; g.style.transform = `scale(${s}) rotate(${(k % 2 ? 1 : -1) * 4}deg)`; });
    const ck = el.querySelector('.clock'); if (!ck.dataset.fit) { let fs = 230; ck.style.fontSize = fs + 'px'; while (ck.firstChild.offsetWidth > 980 && fs > 120) { fs -= 6; ck.style.fontSize = fs + 'px'; } ck.dataset.fit = 1; }
    const lvl = [{ raise: .2 }, { raise: .7, frown: 0 }, { raise: 1, mouth: .6 }][i] || {};
    document.getElementById('cam' + i).innerHTML = rig(Object.assign({ blink: (u > 1.2 && u < 1.3) ? 1 : 0, look: -.6 }, lvl), 280);
    const stk = el.querySelector('.stk'); if (stk) { const ks = back((u - .35) / .22); stk.style.transform = `scale(${u > .35 ? ks : 0}) rotate(${-8 + Math.sin(u * 6) * 4}deg)`; }
    const bub = el.querySelector('.bubble'); const kb = back((u - .12) / .22); bub.style.transform = `scale(${clamp(kb, 0, 1.2)}) rotate(-2deg)`;
  } else if (t < T.end[0]) {                  // ---- Large Sahab verdict
    setMood('gold'); const el = show('sahab'); const u = t - T.sahab[0]; whip(el, u);
    const sp = S.sahab; const lineU = t - sp.at;
    const mouth = (S.mouth && S.mouth.length) ? (S.mouth[Math.round((t - sp.at) * 30)] || 0) : (lineU > 0 && lineU < sp.dur ? Math.abs(Math.sin(lineU * 13)) * .8 : 0);
    const raise = lineU > -.3 ? clamp((lineU + .3) / .25) : 0;
    document.getElementById('sface').innerHTML = rig({ raise, frown: 0, mouth, glint: clamp((u - .15) / .45), twitch: Math.sin(u * 22) * (u > .5 && u < .8 ? 1 : 0), blink: (u > 2.3 && u < 2.4) ? 1 : 0 }, 880);
    document.getElementById('sface').style.transform = `scale(${1.15 - .15 * ease(u / .5)})`;
    const sl = document.getElementById('sline'); sl.style.opacity = lineU > -.05 ? 1 : 0; sl.style.transform = `scale(${lineU > 0 ? back(lineU / .2) : 0}) rotate(1.5deg)`;
  } else {                                     // ---- end card = poster again (loops to frame 0)
    setMood('red'); const el = show('end'); const u = t - T.end[0]; el.style.transform = ''; el.style.filter = '';
    document.getElementById('end-face').innerHTML = rig({ raise: .3, mouth: 0, twitch: Math.sin(u * 20) * (u > .3 && u < .6 ? 1 : 0), blink: (u > 1.6 && u < 1.7) ? 1 : 0 }, 620);
    const k = back(u / .25); document.getElementById('end-t1').style.transform = `scale(${1.5 - .5 * k})`;
    document.getElementById('end-t2').style.opacity = clamp((u - .25) / .15);
    document.getElementById('end-l1').style.opacity = clamp((u - .55) / .2);
    document.getElementById('end-l2').style.opacity = clamp((u - .9) / .2);
    document.getElementById('end-l2').style.transform = `scale(${u > .9 ? back((u - .9) / .2) : 0})`;
  }
  return true;
};
</script>
</body>
</html>
